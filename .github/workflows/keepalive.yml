name: Keepalive

# A free-tier Supabase project pauses after about a week without activity.
# One trivial request a day keeps compass-prod awake. Delete this workflow
# if the production project moves to a paid tier.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query compass-prod
        env:
          SUPABASE_URL: ${{ secrets.KEEPALIVE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.KEEPALIVE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "KEEPALIVE_SUPABASE_URL / KEEPALIVE_SUPABASE_ANON_KEY not set (compass-prod not created yet); skipping"
            exit 0
          fi
          # RLS denies the anon key, so the response is 401/403 — the query still ran.
          # Only a connection failure (curl exit code) fails the job.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$SUPABASE_URL/rest/v1/institutions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "compass-prod answered HTTP $status"
