name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The Vercel GitHub integration deploys every PR. Wait for that deployment and
      # take its URL, so the smoke test runs against the same preview a reviewer opens.
      - name: Wait for Vercel preview
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 12 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo, sha, per_page: 10,
              });
              for (const d of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  ...context.repo, deployment_id: d.id, per_page: 5,
                });
                const ok = statuses.find((s) => s.state === 'success');
                if (ok) {
                  core.setOutput('url', ok.environment_url || ok.target_url);
                  return;
                }
                if (statuses.some((s) => s.state === 'failure' || s.state === 'error')) {
                  core.setFailed('Vercel preview deployment failed');
                  return;
                }
              }
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for the Vercel preview deployment');

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
